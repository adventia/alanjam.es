<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B7A5A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1B7A5A" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B7A5A" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1B7A5A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1B7A5A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="0" fill="#FFFFFF"/>

  <!-- Grid lines -->
  <line x1="80" y1="320" x2="760" y2="320" stroke="#E6E2DB" stroke-width="1"/>
  <line x1="80" y1="260" x2="760" y2="260" stroke="#E6E2DB" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="80" y1="200" x2="760" y2="200" stroke="#E6E2DB" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="80" y1="140" x2="760" y2="140" stroke="#E6E2DB" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="80" y1="80" x2="760" y2="80" stroke="#E6E2DB" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Y-axis redacted labels -->
  <rect x="20" y="70" width="40" height="14" rx="3" fill="#E6E2DB"/>
  <rect x="20" y="130" width="40" height="14" rx="3" fill="#E6E2DB"/>
  <rect x="20" y="190" width="40" height="14" rx="3" fill="#E6E2DB"/>
  <rect x="20" y="250" width="40" height="14" rx="3" fill="#E6E2DB"/>
  <rect x="20" y="310" width="40" height="14" rx="3" fill="#E6E2DB"/>

  <!-- Area under curve -->
  <path d="M80,298 L150,300 L220,296 L290,299 L350,295 L410,297 L460,294 L500,296 C520,290 540,272 565,245 C585,222 610,185 635,148 C655,120 680,95 710,78 L740,68 L740,320 L80,320 Z" fill="url(#area-fill)"/>

  <!-- Hockey stick curve -->
  <path d="M80,298 L150,300 L220,296 L290,299 L350,295 L410,297 L460,294 L500,296 C520,290 540,272 565,245 C585,222 610,185 635,148 C655,120 680,95 710,78 L740,68" stroke="url(#line-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Data points — flat before launch -->
  <circle cx="80" cy="298" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="150" cy="300" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="220" cy="296" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="290" cy="299" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="350" cy="295" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="410" cy="297" r="3" fill="#1B7A5A" opacity="0.35"/>
  <circle cx="460" cy="294" r="3" fill="#1B7A5A" opacity="0.4"/>
  <circle cx="500" cy="296" r="3.5" fill="#1B7A5A" opacity="0.5"/>
  <!-- Data points — climbing after launch -->
  <circle cx="540" cy="272" r="3.5" fill="#1B7A5A" opacity="0.6"/>
  <circle cx="575" cy="238" r="3.5" fill="#1B7A5A" opacity="0.65"/>
  <circle cx="610" cy="185" r="4" fill="#1B7A5A" opacity="0.7"/>
  <circle cx="645" cy="140" r="4" fill="#1B7A5A" opacity="0.8"/>
  <circle cx="680" cy="95" r="4" fill="#1B7A5A" opacity="0.85"/>
  <circle cx="710" cy="78" r="4" fill="#1B7A5A" opacity="0.9"/>

  <!-- Launch marker line -->
  <line x1="500" y1="50" x2="500" y2="320" stroke="#1B7A5A" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Launch label -->
  <rect x="418" y="38" width="164" height="26" rx="4" fill="#1B7A5A" opacity="0.08"/>
  <text x="500" y="56" text-anchor="middle" font-family="Manrope, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1B7A5A" letter-spacing="0.03em">Faceted search goes live</text>

  <!-- End dot -->
  <circle cx="740" cy="68" r="5" fill="#1B7A5A"/>
  <circle cx="740" cy="68" r="9" fill="none" stroke="#1B7A5A" stroke-width="1.5" opacity="0.3"/>

  <!-- X-axis time labels -->
  <text x="80" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9B9690" letter-spacing="0.02em">2024</text>
  <text x="300" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9B9690" letter-spacing="0.02em">Q1 2025</text>
  <text x="500" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9B9690" letter-spacing="0.02em">Q3 2025</text>
  <text x="700" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9B9690" letter-spacing="0.02em">2026</text>

  <!-- Y-axis label -->
  <text x="14" y="200" font-family="Manrope, -apple-system, sans-serif" font-size="10" fill="#9B9690" letter-spacing="0.05em" transform="rotate(-90 14 200)" text-anchor="middle">CONVERSION</text>

  <!-- NDA note -->
  <text x="760" y="370" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C5C0B8" letter-spacing="0.02em">Y-axis values under NDA</text>
</svg>
